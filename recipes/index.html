<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recipes</title>
    <link href="style.css" rel="stylesheet">
    <!-- Facebook, LinkedIn, etc. -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="Recipes">
    <meta property="og:description" content="See different recipes with their description.">
    <meta property="og:url" content="https://austina14.github.io/wdd131/recipes/index.html">
    <meta property="og:image" content="https://austina14.github.io/wdd131/recipes/index.html">
    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Recipes">
    <meta name="twitter:description" content="See different recipes with their description.">
    <meta name="twitter:image" content="https://austina14.github.io/wdd131/recipes/index.html">
    <link rel="apple-touch-icon" href="recipe-book.png">
    <link rel="icon" type="x-icon" href="recipe-book.ico">
    <script src="recipe.js" defer></script>
</head>
<body>
    <header>
        <div id="page-title">
            <img src="recipe-book.png" alt="Recipe Book Icon">
            <h1>RecipeBook</h1>
        </div>
        <div id="search-bar">
            <input id="search" type="text" placeholder="Find a recipe" />
            <span class="search-icon">
                <button id="searchButton"><img src="search.svg" alt="Search"></button>
            </span>
        </div>
    </header>
    <div id="recipe-container"></div>
    <footer>
    
    <div class="social">
    <!-- Social media icons provided under CC from https://www.iconfinder.com/AlfredoCreates  -->
        <a href="#"><img src="instagram_icon.svg" alt="instagram icon"></a>
        <a href="#"><img src="youtube_icon.svg" alt="youtube icon"></a>
        <a href="#"><img src="pinterest_icon.svg" alt="pinterest icon"></a>
    </div>                     
    <a href="https://www.flaticon.com/free-icons/recipe" title="recipe icons">Recipe icons created by Freepik - Flaticon</a>      
    </footer>
</body>
</html>
